# Builds the Windows desktop app (installer + portable .exe) and publishes it as the "escritorio" release.
name: App de escritorio (Windows)

on:
  workflow_dispatch:
  push:
    branches: [claude/pensive-ptolemy-6fkn8o, main]
    paths: ['assets/**', '*.html', 'desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Urbania-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: escritorio
          name: Urbania para Windows
          body: |
            Descarga **Urbania-Instalador** para instalar el juego, o **Urbania-Portable** para jugar sin instalar.
            Windows puede avisar de que la aplicación no está firmada: pulsa «Más información» → «Ejecutar de todas formas».
          make_latest: true
          files: desktop/dist/*.exe
