<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de edificios — Urbania</title>
  <meta name="description" content="Casas, comercios, oficinas, industria y servicios públicos de Urbania.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="catalog">
  <main class="wrap">
    <header class="page-head">
      <h1>Catálogo de edificios</h1>
      <p class="muted">Todos los modelos salen del propio juego. Cada vez que se construye uno, cambian sus colores y detalles, así que estos son solo algunos ejemplos.</p>
    </header>
    <div class="toolbar">
      <input class="search" type="search" placeholder="Buscar edificio…" aria-label="Buscar">
      <span class="count" aria-live="polite"></span>
    </div>
    <div class="toolbar" id="chips" role="toolbar" aria-label="Filtrar por tipo"></div>
    <div class="items" id="items" style="padding-bottom:80px"></div>
  </main>
  <script src="assets/site.js"></script>
  <script>
    const ZONES = {
      res: { label: "Vivienda", color: "#86c96a", names: ["Casa", "Casa grande", "Edificio de viviendas"], unit: "habitantes", cap: [6, 16, 40] },
      com: { label: "Comercio", color: "#6aaeea", names: ["Tienda", "Comercio", "Galerías"], unit: "empleos", cap: [6, 14, 30] },
      off: { label: "Oficinas", color: "#a58cef", names: ["Oficinas", "Edificio de oficinas", "Torre de oficinas"], unit: "empleos", cap: [10, 26, 60] },
      ind: { label: "Industria", color: "#eec05a", names: ["Taller", "Fábrica", "Complejo industrial"], unit: "empleos", cap: [12, 24, 40] },
    };
    const SERVICES = [
      ["police", "Comisaría", "Radio de 9 casillas · 600 € al día"], ["fire", "Bomberos", "Radio de 9 casillas · 650 € al día"],
      ["health", "Centro de salud", "Radio de 9 casillas · 900 € al día"], ["school", "Escuela", "Radio de 9 casillas · 800 € al día"],
      ["park", "Parque", "Radio de 5 casillas · 60 € al día"], ["power", "Central eléctrica", "140 ⚡ · 500 € al día"], ["water", "Torre de agua", "140 💧 · 300 € al día"],
    ];
    const items = [];
    for (const [z, Z] of Object.entries(ZONES))
      for (let lv = 1; lv <= 3; lv++)
        for (let k = 0; k < 4; k++)
          items.push({ cat: Z.label, color: Z.color, name: Z.names[lv - 1], img: `assets/img/catalog/${z}-${lv}-${k}.jpg`, info: `Nivel ${lv} · ${Z.cap[lv - 1]} ${Z.unit}` });
    for (const [id, name, info] of SERVICES) items.push({ cat: "Servicios", color: "#e4553b", name, img: `assets/img/catalog/svc-${id}.jpg`, info });

    const list = document.getElementById("items"), search = document.querySelector(".search"),
          count = document.querySelector(".count"), chips = document.getElementById("chips");
    let cat = "Todos";
    ["Todos", ...Object.values(ZONES).map((z) => z.label), "Servicios"].forEach((c) => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", c === cat);
      b.onclick = () => { cat = c; chips.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === b)); render(); };
      chips.append(b);
    });
    function render() {
      const q = search.value.trim().toLowerCase();
      const found = items.filter((it) => (cat === "Todos" || it.cat === cat) && (it.name + " " + it.cat).toLowerCase().includes(q));
      count.textContent = `${found.length} modelos`;
      list.innerHTML = found.map((it) => `<article class="item"><img src="${it.img}" width="360" height="270" alt="${it.name}" loading="lazy">
        <div><span class="tag" style="background:${it.color}">${it.cat}</span><b>${it.name}</b><small>${it.info}</small></div></article>`).join("");
    }
    search.oninput = render;
    render();
  </script>
</body>
</html>
