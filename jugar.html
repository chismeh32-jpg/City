<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugar — Urbania</title>
  <meta name="description" content="Construye tu ciudad en el navegador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="play">
  <main class="wrap">
    <div class="game">
      <aside class="panel">
        <h3>Herramientas</h3>
        <div class="tools" id="tools"></div>
        <p class="muted" style="font-size:.8rem;margin-top:12px">Clic o arrastra para construir. Clic derecho o <kbd>B</kbd> para demoler. <kbd>Espacio</kbd> pausa.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="pause">⏸ Pausa</button>
          <button class="btn btn-ghost btn-sm" id="reset">Nueva ciudad</button>
        </div>
      </aside>
      <div>
        <div class="hud">
          <div><small>Dinero</small><b id="money"></b></div>
          <div><small>Población</small><b id="pop"></b></div>
          <div><small>Empleo</small><b id="jobs"></b></div>
          <div><small>Felicidad</small><b id="happy"></b></div>
          <div><small>Mes</small><b id="month"></b></div>
        </div>
        <canvas id="board" width="960" height="600" aria-label="Mapa de la ciudad"></canvas>
        <p class="log" id="log" aria-live="polite"></p>
      </div>
    </div>
  </main>
  <script src="assets/site.js"></script>
  <script src="assets/game.js"></script>
</body>
</html>
