<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estilos — Urbania</title>
  <meta name="description" content="Nueve personalidades para tu ciudad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="styles">
  <main class="wrap">
    <header class="page-head">
      <h1>Estilos</h1>
      <p class="muted">Nueve personalidades para tu ciudad. Cámbialo cuando quieras desde el menú 🏙️ del juego: toda la ciudad se redibuja con otros colores y otros tejados.</p>
    </header>
    <div class="grid grid-3" id="styles" style="padding-bottom:80px"></div>
  </main>
  <script src="assets/site.js"></script>
  <script>
    const STYLES = [
      ["clasico", "Clásico", "Fachadas de piedra y ladrillo, tejados a dos aguas y chimeneas.", ["#f4ead8", "#b65a42", "#b5483b", "#5d6878"]],
      ["moderno", "Moderno", "Cubiertas planas, blancos y grises, líneas limpias.", ["#f2f2ee", "#bfc4c8", "#3b3f46", "#8fb7cf"]],
      ["mediterraneo", "Mediterráneo", "Casas encaladas con tejados de teja a cuatro aguas.", ["#faf6ee", "#f1dcc0", "#c8643f", "#5c9fd4"]],
      ["nordico", "Nórdico", "Madera pintada de rojo, mostaza y azul con tejados oscuros.", ["#c94f3a", "#e0a83a", "#a5c4d4", "#2f3b4c"]],
      ["futurista", "Futurista", "Tonos menta y lavanda, azoteas de colores y mucho cristal.", ["#e8f4f2", "#b9f0d8", "#5ee6b0", "#b28cff"]],
      ["tropical", "Tropical", "Colores vivos y tejados de madera para un verano eterno.", ["#ffd166", "#06d6a0", "#ef476f", "#7a5638"]],
      ["industrial", "Industrial", "Ladrillo visto, hormigón y tejados metálicos.", ["#a4553a", "#6b6b6b", "#b38b6d", "#2b2b2b"]],
      ["oriental", "Oriental", "Lacados rojos, maderas claras y tejados a cuatro aguas.", ["#f4ead8", "#c0392b", "#1f2d3d", "#2f5f4f"]],
      ["colonial", "Colonial", "Ocres suaves y tejados de barro, como en una plaza antigua.", ["#f0c987", "#e8b98a", "#6b3e26", "#4e8f6e"]],
    ];
    document.getElementById("styles").innerHTML = STYLES.map(([id, name, desc, sw]) => `
      <article class="card style-card">
        <img src="assets/img/styles/${id}.jpg" width="480" height="300" alt="Barrio de Urbania en estilo ${name.toLowerCase()}" loading="lazy">
        <div class="body"><h3>${name}</h3><p>${desc}</p>
          <div class="swatches">${sw.map((c) => `<i style="background:${c}"></i>`).join("")}</div></div>
      </article>`).join("");
  </script>
</body>
</html>
